{% extends "base.html" %}
{% block title %}BrightScope{% endblock %}
{% block body %}
<div class="app">
  <aside class="rail">
    <div class="rail-head">Saved theses</div>
    <div id="theses" class="theses"><p class="muted small">Nothing saved yet.</p></div>
  </aside>
  <section class="workspace">
    <form id="thesis-form" class="thesis" autocomplete="off">
      <textarea id="thesis" rows="1" spellcheck="false" placeholder="Describe a thesis, e.g. vertical AI for insurance carriers in the US, led by a top fund in the last 18 months, team growing fast"></textarea>
      <button type="submit" class="primary" id="thesis-go">{{ 'Find companies' if ai_enabled else 'Search' }}</button>
    </form>
    <div id="interp" class="interp"></div>
    <div id="filters" class="filterbar"></div>
    <div class="toolbar">
      <span id="count" class="muted"></span>
      <span class="right">
        <span id="save-wrap"><button type="button" id="save">Save thesis</button></span>
        <a id="csv" class="btn" href="/export.csv">Download CSV</a>
      </span>
    </div>
    <div class="tablewrap" id="tablewrap">
      <div class="loadbar" id="loadbar"></div>
      <table class="grid deals" id="grid"><thead></thead><tbody></tbody></table>
    </div>
    <div class="more"><button type="button" id="more" hidden>Load more</button></div>
  </section>
</div>
<script src="/static/deals.js" defer></script>
{% endblock %}
